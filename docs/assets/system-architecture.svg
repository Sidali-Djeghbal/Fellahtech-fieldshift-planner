<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="FELLAH TECH system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A140F"/>
      <stop offset="1" stop-color="#0F1D16"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#D99A28"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8FB49B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F2C14E"/>
    </marker>
    <style>
      .box{fill:#152A1F;stroke:#2C4636;stroke-width:2;rx:16}
      .title{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;fill:#F4F7F2}
      .sub{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;fill:#9DB8A6}
      .tag{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;fill:#0E2018;font-weight:700}
      .lane{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;letter-spacing:2px;fill:#6E8B79;font-weight:600}
      .flow{stroke:#8FB49B;stroke-width:2;fill:none}
      .flowA{stroke:#F2C14E;stroke-width:2.5;fill:none}
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="58" class="title" font-size="30">System Architecture</text>
  <text x="70" y="86" class="sub">Three clients, one contract (<tspan fill="#F2C14E" font-weight="700">/api/v1</tspan>), local datasets, zero external HTTP calls at request time</text>

  <!-- clients -->
  <text x="70" y="140" class="lane">CLIENTS</text>

  <g>
    <rect class="box" x="70" y="165" width="300" height="120"/>
    <text x="92" y="200" class="title">Web Workspace</text>
    <text x="92" y="228" class="sub">Next.js 15 · React 19 · MapLibre</text>
    <text x="92" y="250" class="sub">Static export → Cloudflare Workers</text>
    <rect x="92" y="258" width="70" height="20" rx="10" fill="#F2C14E"/>
    <text x="103" y="273" class="tag">HTTPS</text>
  </g>

  <g>
    <rect class="box" x="70" y="305" width="300" height="120"/>
    <text x="92" y="340" class="title">Mobile App</text>
    <text x="92" y="368" class="sub">Kotlin · Jetpack Compose · Hilt</text>
    <text x="92" y="390" class="sub">Retrofit + DataStore · Android 11+</text>
    <rect x="92" y="398" width="70" height="20" rx="10" fill="#F2C14E"/>
    <text x="103" y="413" class="tag">HTTPS</text>
  </g>

  <!-- gateway / api -->
  <text x="520" y="140" class="lane">EDGE</text>
  <g>
    <rect class="box" x="520" y="165" width="330" height="260" fill="#13251C"/>
    <text x="544" y="202" class="title">Backend API</text>
    <text x="544" y="230" class="sub">FastAPI · Python 3.12 · async SQLAlchemy</text>
    <text x="544" y="262" class="sub">JWT + guest sessions · Idempotency-Key</text>
    <text x="544" y="284" class="sub">Redis rate limits · circuit breaker</text>
    <text x="544" y="306" class="sub">34 /api/v1 routes · OpenAPI 3.1</text>
    <rect x="544" y="330" width="180" height="24" rx="12" fill="url(#amber)"/>
    <text x="560" y="347" class="tag">CONTRACT v3.2</text>
    <rect x="544" y="366" width="90" height="24" rx="12" fill="#22362A"/>
    <text x="558" y="383" font-family="Inter,sans-serif" font-size="13" fill="#D9E5DC">Docker</text>
    <rect x="646" y="366" width="96" height="24" rx="12" fill="#22362A"/>
    <text x="660" y="383" font-family="Inter,sans-serif" font-size="13" fill="#D9E5DC">uvicorn</text>
  </g>

  <!-- data -->
  <text x="940" y="140" class="lane">STATE</text>
  <g>
    <rect class="box" x="940" y="165" width="330" height="110"/>
    <text x="964" y="200" class="title">PostgreSQL 16 + PostGIS 3.4</text>
    <text x="964" y="228" class="sub">public schema · dataset schema</text>
    <text x="964" y="250" class="sub">farms · fields · analyses · catalog</text>
  </g>
  <g>
    <rect class="box" x="940" y="290" width="160" height="110"/>
    <text x="962" y="325" class="title" font-size="19">Redis 7</text>
    <text x="962" y="352" class="sub">queues</text>
    <text x="962" y="374" class="sub">rate limits</text>
  </g>
  <g>
    <rect class="box" x="1110" y="290" width="160" height="110"/>
    <text x="1132" y="325" class="title" font-size="19">Worker</text>
    <text x="1132" y="352" class="sub">job leasing</text>
    <text x="1132" y="374" class="sub">async analyses</text>
  </g>

  <!-- si model -->
  <text x="520" y="490" class="lane">DECISION ENGINE</text>
  <g>
    <rect class="box" x="520" y="515" width="330" height="180"/>
    <text x="544" y="552" class="title">SI Model</text>
    <text x="544" y="580" class="sub">FastAPI · geopandas · rasterio</text>
    <text x="544" y="602" class="sub">Temporal rotation planner</text>
    <text x="544" y="624" class="sub">13 crops · 15 crop rules · 10 sequence rules</text>
    <text x="544" y="646" class="sub">Deterministic · audit-ready outputs</text>
    <rect x="544" y="660" width="140" height="22" rx="11" fill="#F2C14E"/>
    <text x="556" y="676" class="tag">/fields/analyze</text>
  </g>
  <g>
    <rect class="box" x="940" y="515" width="330" height="180"/>
    <text x="964" y="552" class="title">Local datasets</text>
    <text x="964" y="580" class="sub">SoilGrids 250 m · NASA POWER 2016–2025</text>
    <text x="964" y="602" class="sub">Sentinel-2 10 m · SRTM DEM</text>
    <text x="964" y="624" class="sub">Guelma boundaries (34 communes)</text>
    <text x="964" y="646" class="sub">Agronomic knowledge base (JSON)</text>
    <rect x="964" y="660" width="170" height="22" rx="11" fill="#22362A"/>
    <text x="978" y="676" font-family="Inter,sans-serif" font-size="13" fill="#D9E5DC">VERSIONED SNAPSHOT</text>
  </g>

  <!-- flows -->
  <path class="flow" d="M370 225 H500 V285 H512" marker-end="url(#arrow)"/>
  <path class="flow" d="M370 365 H450 V320 H512" marker-end="url(#arrow)"/>
  <path class="flow" d="M850 240 H930" marker-end="url(#arrow)"/>
  <path class="flow" d="M850 320 H930" marker-end="url(#arrow)"/>
  <path class="flow" d="M1100 400 V440 H1110 V470 H870 V505" marker-end="url(#arrow)"/>
  <path class="flowA" d="M850 605 H930" marker-end="url(#arrowAmber)"/>

  <!-- legend -->
  <g>
    <rect x="70" y="730" width="1200" height="56" rx="14" fill="#0F1D16" stroke="#22362A"/>
    <text x="94" y="765" class="sub">Client → API: HTTPS JSON · API → DB: asyncpg · API → Model: internal HTTP · Jobs: Redis-backed worker · All data local (ADR-1 / ADR-9)</text>
  </g>
</svg>
