<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="FELLAH TECH banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08120D"/>
      <stop offset="0.55" stop-color="#0E2018"/>
      <stop offset="1" stop-color="#16281B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CE63"/>
      <stop offset="1" stop-color="#D08F1E"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#D99A28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#F2C14E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FB49B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>

  <!-- topographic contours -->
  <g fill="none" stroke="#8FB49B" stroke-opacity="0.12" stroke-width="1.2">
    <path d="M1120 400c-70-80-10-140 80-150s165 5 215-55 55-125 0-165"/>
    <path d="M1055 415c-60-95 5-165 105-175s185-5 235-70 45-130-20-170"/>
    <path d="M990 430c-50-110 20-190 130-200s205-15 255-85 35-135-40-175"/>
  </g>

  <!-- logo card (identical mark to docs/assets/logo.svg) -->
  <g transform="translate(88 128)">
    <rect width="144" height="144" rx="34" fill="#0E2018"/>
    <rect x="10" y="10" width="124" height="124" rx="28" fill="url(#card)"/>
    <g filter="url(#soft)" transform="translate(12 10) scale(0.5)">
      <path d="M120 46c-32 0-58 26-58 58 0 42 58 90 58 90s58-48 58-90c0-32-26-58-58-58z" fill="#0E2018"/>
      <path d="M120 76c-18 13-26 32-21 51 16-3 34-14 42-32 5-11 2-23-6-29-5 5-9 7-15 10z" fill="#F6CE63"/>
      <circle cx="120" cy="105" r="8" fill="#0E2018"/>
    </g>
  </g>

  <!-- brand -->
  <text x="276" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#F4F7F2" letter-spacing="1">FELLAH TECH</text>
  <text x="278" y="238" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9DB8A6" letter-spacing="6.5">CROP ROTATION INTELLIGENCE</text>

  <rect x="276" y="264" width="86" height="4" rx="2" fill="url(#amber)"/>

  <text x="276" y="304" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#D9E5DC">Guelma · Wilaya 24 · Algeria</text>
  <text x="276" y="334" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#7E9A87">Trilingual EN / FR / AR (RTL) · NASA GIBS · MapLibre · PostGIS</text>

  <!-- module chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="1120" y="150" width="186" height="44" rx="22" fill="#F2C14E"/>
    <text x="1146" y="179" fill="#0E2018">Web · Next.js 15</text>

    <rect x="1322" y="150" width="150" height="44" rx="22" fill="#22362A" stroke="#2C4636"/>
    <text x="1348" y="179" fill="#D9E5DC">Mobile · Kotlin</text>

    <rect x="1120" y="210" width="186" height="44" rx="22" fill="#22362A" stroke="#2C4636"/>
    <text x="1148" y="239" fill="#D9E5DC">API · FastAPI</text>

    <rect x="1322" y="210" width="150" height="44" rx="22" fill="#22362A" stroke="#2C4636"/>
    <text x="1348" y="239" fill="#D9E5DC">SI Model</text>
  </g>

  <text x="1120" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7E9A87">34 communes · versioned local datasets</text>
  <text x="1120" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7E9A87">Zero external HTTP at request time</text>
</svg>
