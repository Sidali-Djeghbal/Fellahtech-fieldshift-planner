    <path d="M1020 330c-40-70 10-120 90-130s150 10 200-40 60-120 10-160"/>
    <path d="M960 350c-30-90 30-150 120-160s170 0 220-60 50-120-10-160"/>
    <path d="M900 365c-20-110 50-175 150-185s190-10 240-80 40-120-30-160"/>
  </g>

