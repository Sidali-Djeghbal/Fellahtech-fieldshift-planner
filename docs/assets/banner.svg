  <text x="256" y="176" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#F4F7F2" letter-spacing="1">FELLAH TECH</text>
  <text x="258" y="220" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#9DB8A6" letter-spacing="6">CROP ROTATION INTELLIGENCE</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#D9E5DC">
