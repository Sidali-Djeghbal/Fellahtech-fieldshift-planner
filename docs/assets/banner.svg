  </g>

  <rect x="256" y="292" width="72" height="4" rx="2" fill="url(#amber)"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#0E2018">
    <rect x="1030" y="140" width="180" height="42" rx="21" fill="#F2C14E"/>
    <text x="1074" y="168" font-weight="700">Web · Next.js</text>
    <rect x="1226" y="140" width="140" height="42" rx="21" fill="#22362A"/>
    <text x="1262" y="168" font-weight="700" fill="#D9E5DC">Mobile</text>
