    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#F2C14E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FB49B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>
  <rect width="1600" height="360" fill="url(#glow)"/>

  <!-- topographic contours -->
