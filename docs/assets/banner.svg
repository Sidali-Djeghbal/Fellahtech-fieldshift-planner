    <path d="M62 26c-20 0-36 16-36 36 0 26 36 50 36 50s36-24 36-50c0-20-16-36-36-36z" fill="#0E2018"/>
    <path d="M62 44c-11 8-16 20-13 32 10-2 21-9 26-20 3-7 1-14-4-18-3 3-6 4-9 6z" fill="#F2C14E"/>
    <circle cx="62" cy="62" r="5" fill="#0E2018"/>
