[project]
name = "fieldshift-backend"
version = "3.2.0"
description = "FieldShift Planner crop-rotation planning backend API and async worker"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1,<2.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "geoalchemy2>=0.14.7,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.22.0,<5.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "redis>=5.0.4,<6.0.0",
    "referencing>=0.35.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "structlog>=24.1.0,<26.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.4.4,<1.0.0",
    "types-jsonschema>=4.22.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
